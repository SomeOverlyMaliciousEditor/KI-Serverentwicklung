[project]
name = "ki-serverentwicklung"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "linux", email = "linux@x1.de" }
]
requires-python = ">=3.15"
dependencies = [
    "graphviz>=0.21",
    "graphviz-anywidget>=0.8.0",
    "npm>=0.1.1",
]

[project.scripts]
ki-serverentwicklung = "ki_serverentwicklung:main"

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8",
]
lint = [
    "ruff>=0.14",
    "ty>=0.0.1",
]

[tool.uv]
default-groups = ["dev", "lint"]

[tool.ruff]
src = ["src"]
target-version = "py315"
preview = false

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["ki_serverentwicklung"]

[tool.ruff.format]
quote-style = "double"

[tool.ty.environment]
python-version = "3.15"
root = ["src"]

[tool.pyrefly]
project-includes = ["src"]
python-version = "3.15"
preset = "strict"
